name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Laravel 13 / PHP 8.3 / MySQL 5.7
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: apfpress_ci
          MYSQL_USER: apfpress
          MYSQL_PASSWORD: apfpress_ci
          MYSQL_ROOT_PASSWORD: apfpress_root_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -papfpress_root_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      APF_IMPORT_DOWNLOAD_MEDIA: 'false'
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: apfpress_ci
      DB_USERNAME: apfpress
      DB_PASSWORD: apfpress_ci
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      SESSION_SECURE_COOKIE: 'false'

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, pdo_mysql, pdo_sqlite, sqlite3, xml, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify committed production assets
        run: |
          git status --short -- public/build
          git diff --exit-code -- public/build
          test -z "$(git ls-files --others --exclude-standard -- public/build)"

      - name: Run frontend tests
        run: npm test

      - name: Verify MySQL 5.7 migrations and seeders
        run: php artisan migrate:fresh --seed --force

      - name: Run Laravel tests
        run: php artisan test

      - name: Compile application routes
        run: php artisan route:list --except-vendor

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Run rendered browser journeys
        run: |
          APP_URL=http://127.0.0.1:8080 SESSION_DRIVER=database php artisan serve --host=127.0.0.1 --port=8080 > storage/logs/ci-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/up >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              cat storage/logs/ci-browser-server.log
              exit 1
            fi
            sleep 1
          done
          if ! APFPRESS_BASE_URL=http://127.0.0.1:8080 npm run test:browser; then
            cat storage/logs/ci-browser-server.log
            exit 1
          fi
